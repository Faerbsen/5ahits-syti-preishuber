[platformio]
default_envs = dev

[env:dev]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_speed = 115200
monitor_speed = 115200
test_framework = unity
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:testing]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.0